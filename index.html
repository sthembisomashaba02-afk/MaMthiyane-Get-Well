<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Get Well Soon ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="hearts"></div>

  <main class="page">

    <!-- Opening -->
    <section id="opening" class="scene active">

      <div class="heart-wrapper">
        <div class="big-heart">❤️</div>
      </div>

      <p class="small-text">
        A little message for you...
      </p>

    </section>


    <!-- Messages -->
    <section id="messages" class="scene">

      <div class="message-container">

        <p id="messageText"></p>

      </div>

    </section>


    <!-- Final message -->
    <section id="final" class="scene">

      <div class="final-card">

        <div class="roses">
          🌹 ❤️ 🌹
        </div>

        <h1>
          HOPEFULLY YOU GET<br>
          BETTER SOON
        </h1>

        <div class="name">
          MaMTHIYANE WAM ❤️
        </div>

        <div class="heart-line">
          ♡━━━━━━♡
        </div>

        <p class="final-message">
          Rest, take care of yourself,
          and know that someone is thinking
          about you. ❤️
        </p>

        <div class="final-heart">
          💗
        </div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
